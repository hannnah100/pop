kind = "web"
previewPath = "/"
title = "Pop: The Question"
version = "1.0.0"
id = "artifacts/pop-the-question"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

# In development the Vite dev server runs and Replit routes "/" here.
# In production the API server (artifacts/api-server) is the single entry
# point — it builds and serves the frontend static files itself.
[[services]]
name = "web"
paths = [ "/" ]
localPort = 23247

[services.development]
run = "pnpm --filter @workspace/pop-the-question run dev"

[services.env]
PORT = "23247"
BASE_PATH = "/"
