kind = "web"
previewPath = "/"
title = "Pop: The Question"
version = "1.0.0"
id = "artifacts/pop-the-question"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/"]
localPort = 23247

[services.development]
run = "pnpm --filter @workspace/pop-the-question run dev"

[services.env]
PORT = "23247"
BASE_PATH = "/"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/pop-the-question", "run", "build"]

[services.production.build.env]
PORT = "23247"
BASE_PATH = "/"
NODE_ENV = "production"
