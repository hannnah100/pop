openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Pop The Question API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: daily
    description: Daily games
  - name: rooms
    description: Hosted game rooms
  - name: questions
    description: Question packs
  - name: custom-games
    description: User-created custom game packs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /daily/three-flops:
    get:
      operationId: getTodayThreeFlops
      tags: [daily]
      summary: Get today's Three Flops challenge
      responses:
        "200":
          description: Today's challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreeFlopsChallenge"
        "404":
          description: No challenge for today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /daily/three-flops/archive:
    get:
      operationId: getThreeFlopsArchive
      tags: [daily]
      summary: Get archive of Three Flops challenges
      responses:
        "200":
          description: List of past challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThreeFlopsSummary"

  /daily/three-flops/{id}:
    get:
      operationId: getThreeFlopsById
      tags: [daily]
      summary: Get a specific Three Flops challenge by ID (for archive replay)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreeFlopsChallenge"
        "404":
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /daily/three-flops/leaderboard:
    get:
      operationId: getThreeFlopsLeaderboard
      tags: [daily]
      summary: Get Three Flops leaderboard
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
        - name: playerToken
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Leaderboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreeFlopsLeaderboard"

  /daily/three-flops/score:
    post:
      operationId: submitThreeFlopsScore
      tags: [daily]
      summary: Submit a Three Flops score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreeFlopsScoreRequest"
      responses:
        "200":
          description: Score submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "400":
          description: Invalid request
          content:
