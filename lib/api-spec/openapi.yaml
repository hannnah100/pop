      operationId: updateCustomQuizPack
      tags: [custom-games]
      summary: Update a custom Pub Quiz pack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: x-owner-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomPackPayload"
      responses:
        "200":
          description: Updated pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomGameSummary"
    delete:
      operationId: deleteCustomQuizPack
      tags: [custom-games]
      summary: Delete a custom Pub Quiz pack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: x-owner-id
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /rooms/create:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a new hosted game room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "200":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomCreated"

  /rooms/{code}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get room info
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /questions/pop-the-question:
    get:
      operationId: getPopTheQuestionPrompts
      tags: [questions]
      summary: Get Pop the Question prompts
      responses:
        "200":
          description: List of prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionPrompt"

  /questions/roast-roulette:
    get:
      operationId: getRoastRouletteQuestions
      tags: [questions]
      summary: Get Roast Roulette questions
      responses:
        "200":
          description: List of questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoastQuestion"

components:
  schemas:
    CustomPackPayload:
      type: object
      additionalProperties: true
      description: Raw pack payload (validated server-side by game-type-specific Zod schema)

    CustomGameSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        payload:
          $ref: "#/components/schemas/CustomPackPayload"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - payload

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ThreeFlopsAnswer:
      type: object
      properties:
        display:
          type: string
        hint:
          type: string
        correct:
          type: array
          items:
            type: string
      required:
        - display
        - hint
        - correct

    ThreeFlopsChallenge:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        title:
          type: string
        prompt:
          type: string
        totalCount:
          type: integer
        answers:
          type: array
          items:
            $ref: "#/components/schemas/ThreeFlopsAnswer"
      required:
        - id
        - date
        - title
        - prompt
        - totalCount
        - answers

    ThreeFlopsSummary:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        title:
          type: string
        prompt:
          type: string
        totalCount:
          type: integer
      required:
        - id
        - date
        - title
        - prompt
        - totalCount

    CrosswordPuzzle:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        grid:
          type: array
          items:
            type: array
            items:
              type: string
        blackSquares:
          type: array
          items:
            type: array
            items:
              type: integer
        cluesAcross:
          type: object
          additionalProperties:
            type: string
        cluesDown:
          type: object
          additionalProperties:
            type: string
      required:
        - id
        - date
        - grid
        - blackSquares
        - cluesAcross
        - cluesDown

    CrosswordSummary:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
      required:
        - id
        - date

    DailyStatus:
      type: object
      properties:
        date:
          type: string
        threeFlopsAvailable:
          type: boolean
        crosswordAvailable:
          type: boolean
        popBoxAvailable:
          type: boolean
        threeFlopsTitle:
          type: string
        crosswordDate:
          type: string
        popBoxDate:
          type: string
      required:
        - date
        - threeFlopsAvailable
        - crosswordAvailable
        - popBoxAvailable

    PopBoxCategory:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        group:
          type: string
      required:
        - id
        - label
        - group

    PopBoxGrid:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        mode:
          type: string
          nullable: true
        rowCategories:
          type: array
          items:
            $ref: "#/components/schemas/PopBoxCategory"
        columnCategories:
          type: array
          items:
            $ref: "#/components/schemas/PopBoxCategory"
      required:
        - id
        - date
        - difficulty
        - rowCategories
        - columnCategories

    PopBoxSummary:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        difficulty:
          type: string
        mode:
          type: string
          nullable: true
      required:
        - id
        - date
        - difficulty

    PopBoxValidCelebrity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        guessCount:
          type: integer
        rarityPercent:
          type: number
      required:
        - id
        - name
        - guessCount
        - rarityPercent

    PopBoxCellAnswers:
      type: object
      properties:
        squareIndex:
          type: integer
        rowCategoryId:
          type: string
        columnCategoryId:
          type: string
        validCelebrities:
          type: array
          items:
            $ref: "#/components/schemas/PopBoxValidCelebrity"
      required:
        - squareIndex
        - rowCategoryId
        - columnCategoryId
        - validCelebrities

    PopBoxAnswers:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        totalGuesses:
          type: integer
        cells:
          type: array
          items:
            $ref: "#/components/schemas/PopBoxCellAnswers"
      required:
        - id
        - date
        - totalGuesses
        - cells

    PopBoxGuessRequest:
      type: object
      properties:
        squareIndex:
          type: integer
          minimum: 0
          maximum: 8
        guess:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - squareIndex
        - guess

    PopBoxGuessResult:
      type: object
      properties:
        correct:
          type: boolean
        reason:
          type: string
          nullable: true
          enum: [unknown_celebrity, wrong_cell, null]
        celebrityId:
          type: string
          nullable: true
        celebrityName:
          type: string
          nullable: true
        rarityPercent:
          type: number
          nullable: true
      required:
        - correct

    CreateRoomRequest:
      type: object
      properties:
        gameType:
          type: string
          enum: [pop-the-question, roast-roulette, pub-quiz, jeopardy, wheel-of-fortune, scattergories, read-the-room]
        demo:
          type: boolean
        packId:
          type: string
      required:
        - gameType

    RoomCreated:
      type: object
      properties:
        roomCode:
          type: string
        gameType:
          type: string
      required:
        - roomCode
        - gameType

    Room:
      type: object
      properties:
        code:
          type: string
        gameType:
          type: string
        status:
          type: string
          enum: [lobby, playing, finished]
        playerCount:
          type: integer
      required:
        - code
        - gameType
        - status
        - playerCount

    QuestionPrompt:
      type: object
      properties:
        id:
          type: integer
        prompt:
          type: string
        category:
          type: string
      required:
        - id
        - prompt

    RoastQuestion:
      type: object
      properties:
        id:
          type: integer
        question:
          type: string
        color:
          type: string
      required:
        - id
        - question

    PopOrDropSummary:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        title:
          type: string
        prompt:
          type: string
      required:
        - id
        - date
        - title
        - prompt

    PopOrDropItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: number
        unit:
          type: string
        metricLabel:
          type: string
        category:
          type: string
      required:
        - id
        - name
        - value
        - unit
        - metricLabel
        - category

    PopOrDropSequence:
      type: object
      properties:
        date:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PopOrDropItem"
      required:
        - date
        - items

    PopOrDropLeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        playerToken:
          type: string
        streak:
          type: integer
        playerName:
          type: string
          nullable: true
      required:
        - rank
        - playerToken
        - streak

    PopOrDropLeaderboard:
      type: object
      properties:
        date:
          type: string
        top10:
          type: array
          items:
            $ref: "#/components/schemas/PopOrDropLeaderboardEntry"
        totalPlayers:
          type: integer
        avgStreak:
          type: integer
        medianStreak:
          type: integer
        playerRank:
          type: integer
          nullable: true
      required:
        - date
        - top10
        - totalPlayers
        - avgStreak
        - medianStreak

    ClockItLeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        playerToken:
          type: string
        score:
          type: integer
        hintsUsed:
          type: integer
        playerName:
          type: string
          nullable: true
      required:
        - rank
        - playerToken
        - score
        - hintsUsed

    ClockItLeaderboard:
      type: object
      properties:
        date:
          type: string
        top10:
          type: array
          items:
            $ref: "#/components/schemas/ClockItLeaderboardEntry"
        totalPlayers:
          type: integer
        avgScore:
          type: integer
        playerRank:
          type: integer
          nullable: true
      required:
        - date
        - top10
        - totalPlayers
        - avgScore

    ClockItScoreRequest:
      type: object
      properties:
        playerToken:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 3
        hintsUsed:
          type: integer
          minimum: 1
          maximum: 3
        date:
          type: string
      required:
        - playerToken
        - score
        - hintsUsed
        - date

    ClockItPuzzle:
      type: object
      properties:
        id:
          type: string
          description: Opaque daily identifier (date-based, does not contain the year)
        date:
          type: string
        year:
          type: integer
          description: The correct answer year for this puzzle
        hints:
          type: array
          items:
            type: string
          minItems: 3
          maxItems: 3
      required:
        - id
        - date
        - year
        - hints

    ClockItCheckRequest:
      type: object
      properties:
        id:
          type: string
          description: Opaque daily identifier returned by the GET endpoint
        guess:
          type: integer
        giveUp:
          type: boolean
      required:
        - id

    ClockItCheckResponse:
      type: object
      properties:
        correct:
          type: boolean
        year:
          type: integer
          nullable: true
      required:
        - correct

    PopOrDropScoreRequest:
      type: object
      properties:
        playerToken:
          type: string
        streak:
          type: integer
          minimum: 0
        date:
          type: string
      required:
        - playerToken
        - streak
        - date

    ThreeFlopsLeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        playerToken:
          type: string
        score:
          type: integer
        playerName:
          type: string
          nullable: true
      required:
        - rank
        - playerToken
        - score

    ThreeFlopsLeaderboard:
      type: object
      properties:
        date:
          type: string
        top10:
          type: array
          items:
            $ref: "#/components/schemas/ThreeFlopsLeaderboardEntry"
        totalPlayers:
          type: integer
        avgScore:
          type: integer
        medianScore:
          type: integer
        playerRank:
          type: integer
          nullable: true
      required:
        - date
        - top10
        - totalPlayers
        - avgScore
        - medianScore

    ThreeFlopsScoreRequest:
      type: object
      properties:
        playerToken:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        date:
          type: string
      required:
        - playerToken
        - score

    ReelConnectionsChallenge:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        actors:
          type: array
          items:
            type: string
        validAnswers:
          type: array
          items:
            type: array
            items:
              type: string
      required:
        - id
        - date
        - actors
        - validAnswers

    ReelConnectionsSummary:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
      required:
        - id
        - date

    ReelConnectionsLeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        playerToken:
          type: string
        score:
          type: integer
        playerName:
          type: string
          nullable: true
      required:
        - rank
        - playerToken
        - score

    ReelConnectionsLeaderboard:
      type: object
      properties:
        date:
          type: string
        top10:
          type: array
          items:
            $ref: "#/components/schemas/ReelConnectionsLeaderboardEntry"
        totalPlayers:
          type: integer
        avgScore:
          type: number
        medianScore:
          type: number
        playerRank:
          type: integer
          nullable: true
      required:
        - date
        - top10
        - totalPlayers
        - avgScore
        - medianScore

    ReelConnectionsScoreRequest:
      type: object
      properties:
        playerToken:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 5
        date:
          type: string
      required:
        - playerToken
        - score
        - date
        - date

    PopBoxLeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        playerToken:
          type: string
        score:
          type: integer
        playerName:
          type: string
          nullable: true
      required:
        - rank
        - playerToken
        - score

    PopBoxLeaderboard:
      type: object
      properties:
        date:
          type: string
        top10:
          type: array
          items:
            $ref: "#/components/schemas/PopBoxLeaderboardEntry"
        totalPlayers:
          type: integer
        avgScore:
          type: integer
        medianScore:
          type: integer
        playerRank:
          type: integer
          nullable: true
      required:
        - date
        - top10
        - totalPlayers
        - avgScore
        - medianScore

    PopBoxScoreRequest:
      type: object
      properties:
        playerToken:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 9
        date:
          type: string
      required:
        - playerToken
        - score
        - date

    SkinnyLeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        playerToken:
          type: string
        completionTimeSecs:
          type: integer
        playerName:
          type: string
          nullable: true
      required:
        - rank
        - playerToken
        - completionTimeSecs

    SkinnyLeaderboard:
      type: object
      properties:
        puzzleId:
          type: string
        top10:
          type: array
          items:
            $ref: "#/components/schemas/SkinnyLeaderboardEntry"
        totalPlayers:
          type: integer
        avgTimeSecs:
          type: integer
        medianTimeSecs:
          type: integer
        playerRank:
          type: integer
          nullable: true
      required:
        - puzzleId
        - top10
        - totalPlayers
        - avgTimeSecs
        - medianTimeSecs

    UpdatePlayerNameRequest:
      type: object
      properties:
        playerToken:
          type: string
        playerName:
          type: string
          minLength: 1
          maxLength: 20
      required:
        - playerToken
        - playerName

    SkinnyScoreRequest:
      type: object
      properties:
        playerToken:
          type: string
        puzzleId:
          type: string
        completionTimeSecs:
          type: integer
          minimum: 0
      required:
        - playerToken
        - puzzleId
        - completionTimeSecs
